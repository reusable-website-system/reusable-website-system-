<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body class="admin"><header><a class="brand" href="index.html"><b>W</b><span><strong>Website Admin</strong><small>Content management panel</small></span></a><a href="index.html">← View website</a></header><main class="admin-main"><section id="loginPanel" class="panel"><label>SECURE ACCESS</label><h1>Admin Login</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn" id="loginButton">Login to dashboard</button><p id="authMessage"></p></form></section><section id="dashboardPanel" class="hidden"><h1>Dashboard</h1><button id="logoutButton" class="secondary">Logout</button><div class="tabs"><button class="tab-button active" data-tab="noticesTab">Notices</button><button class="tab-button" data-tab="galleryTab">Gallery</button></div><section id="noticesTab" class="panel tab-content"><h2>नई सूचना प्रकाशित करें</h2><form id="noticeForm"><label>शीर्षक<input id="noticeTitle" maxlength="120" required></label><label>तारीख<input id="noticeDate" type="date"></label><label>विवरण<textarea id="noticeBody" maxlength="3000" required></textarea></label><button class="btn">Publish notice</button><p id="noticeMessage"></p></form><h3>Published notices</h3><div id="adminNoticeList"></div></section><section id="galleryTab" class="panel tab-content hidden"><h2>फोटो अपलोड करें</h2><form id="galleryForm"><label>फोटो का शीर्षक<input id="photoTitle" maxlength="120"></label><label>फोटो चुनें<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" required></label><button class="btn">Upload photo</button><p id="galleryMessage"></p></form><h3>Published photos</h3><div id="adminGalleryList"></div></section></section></main><script type="module" src="js/admin.js"></script></body></html>
